name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up npm Trusted Publishing support
        run: npm install --global 'npm@^11.5.1' && npm --version

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests when configured
        run: npm test --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and build
        run: npm run rebuild

      - name: Publish package
        run: npm publish --access public --provenance

      - name: Create GitHub release with changelog
        run: npx release-it --ci --no-increment
        env:
          GITHUB_TOKEN: ${{ github.token }}


